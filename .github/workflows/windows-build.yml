name: Build MentorAI Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r requirements-windows.txt

      - name: Build Windows executable
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm mentorai_windows.spec

      - name: Verify PE executable
        shell: pwsh
        run: |
          $exe = Get-Item "dist\MentorAI.exe"
          if ($exe.Length -lt 1000000) { throw "El ejecutable es sospechosamente pequeño: $($exe.Length) bytes" }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "El archivo no empieza por la firma MZ de Windows" }
          Write-Host "PE candidate verified: $($exe.Length) bytes"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer\mentorai_windows.nsi'

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash "dist\MentorAI.exe" -Algorithm SHA256 | Format-List | Out-File "dist\SHA256SUMS.txt"
          Get-FileHash "dist\MentorAI-Setup.exe" -Algorithm SHA256 | Format-List | Out-File "dist\SHA256SUMS.txt" -Append

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MentorAI-Windows-${{ github.ref_name }}
          path: |
            dist/MentorAI.exe
            dist/MentorAI-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
