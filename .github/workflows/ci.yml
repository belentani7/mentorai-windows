name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Doctor
        run: python scripts/doctor.py
      - name: Tests
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -v || true; fi
