name: CI

# Puerta rápida para cada push: sin duplicar el matrix completo de ci-cd.yml.
# Falla pronto ante problemas de sintaxis, estructura o tests unitarios.

on: [push]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONPATH: .

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Compile all Python sources
        run: python -m compileall -q core cli ui native_modules tests tools scripts
      - name: Validate repository layout
        run: python tools/validate_repository.py
      - name: Run unit tests
        run: python -m pytest
