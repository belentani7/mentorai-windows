name: CI/CD Pipeline - MentorAI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-tests:
    runs-on: ubuntu-latest
    name: Security Testing
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography
    
    - name: Run security tests
      run: python tests/security_tests.py
    
    - name: Run penetration tests
      run: python tests/penetration_testing.py

  usability-tests:
    runs-on: ubuntu-latest
    name: Usability Testing
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Run usability tests
      run: python tests/usability_tests_kid.py

  multilingual-tests:
    runs-on: ubuntu-latest
    name: Multilingual Testing
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Run multilingual tests
      run: python tests/multilingual_tests.py

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install linting tools
      run: |
        pip install flake8 pylint black
    
    - name: Lint with flake8
      run: flake8 core/ tests/ --count --show-source --statistics
    
    - name: Check code formatting
      run: black --check core/ tests/

  build:
    needs: [security-tests, usability-tests, multilingual-tests, code-quality]
    runs-on: ubuntu-latest
    name: Build
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build application
      run: |
        echo "Building MentorAI..."
        mkdir -p dist/
        cp -r core/ dist/
        cp -r knowledge_base/ dist/
        cp -r docs/ dist/
    
    - name: Create release artifact
      run: |
        tar -czf mentorai-${{ github.sha }}.tar.gz dist/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: mentorai-build
        path: mentorai-${{ github.sha }}.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: mentorai-build
    
    - name: Deploy to production
      run: |
        echo "Deploying MentorAI v${{ github.sha }} to production..."
        # Deployment scripts would go here
        echo "Deployment completed successfully!"
