name: MentorAI CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    name: Runtime and UI smoke tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-windows.txt
      - name: Validate syntax and repository
        run: |
          python -m compileall -q core cli ui native_modules tests tools
          python tools/validate_repository.py
      - name: Run offline smoke test
        run: python tests/smoke_runtime.py
      - name: Run headless UI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ui_smoke.py

  security-tests:
    runs-on: ubuntu-latest
    name: Security regression tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security dependency
        run: python -m pip install "cryptography==43.0.3"
      - name: Run security tests
        run: python tests/security_tests.py
      - name: Run penetration regression checks
        run: python tests/penetration_testing.py

  usability-tests:
    runs-on: ubuntu-latest
    name: Beginner usability tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run usability tests
        run: python tests/usability_tests_kid.py

  multilingual-tests:
    runs-on: ubuntu-latest
    name: Multilingual tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run multilingual tests
        run: python tests/multilingual_tests.py

  code-quality:
    runs-on: ubuntu-latest
    name: Code quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install flake8 black
      - name: Lint active Python sources
        run: >-
          flake8 core/assistant_engine.py core/local_store.py core/security_manager.py
          core/screen_orchestrator.py cli/mentorai_cli.py ui/mentorai_windows_ui.py
          native_modules/windows_screen_reader.py native_modules/windows_hotkey.py
          tests/smoke_runtime.py tests/ui_smoke.py tests/penetration_testing.py
          --count --show-source --statistics --max-line-length=120
          --ignore=E203,W503,E402,E501,W293
      - name: Check formatting of active sources
        run: >-
          black --check core/assistant_engine.py core/local_store.py core/security_manager.py
          core/screen_orchestrator.py cli/mentorai_cli.py ui/mentorai_windows_ui.py
          native_modules/windows_screen_reader.py native_modules/windows_hotkey.py
          tests/smoke_runtime.py tests/ui_smoke.py tests/penetration_testing.py

  source-package:
    needs: [runtime-tests, security-tests, usability-tests, multilingual-tests, code-quality]
    runs-on: ubuntu-latest
    name: Source package
    steps:
      - uses: actions/checkout@v4
      - name: Build source snapshot
        run: |
          mkdir -p dist/source
          cp -r core cli ui native_modules knowledge_base tests docs dist/source/
          cp README.md LICENSE.md requirements-windows.txt dist/source/
          tar -czf mentorai-${{ github.sha }}.tar.gz dist/
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mentorai-source-${{ github.sha }}
          path: mentorai-${{ github.sha }}.tar.gz
