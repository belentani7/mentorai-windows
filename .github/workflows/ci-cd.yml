name: CI/CD Pipeline - MentorAI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  security-tests:
    runs-on: ubuntu-latest
    name: Security Testing
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography
    
    - name: Validate repository structure
      run: python tools/validate_repository.py

    - name: Run security tests
      run: python tests/security_tests.py
    
    - name: Run penetration tests
      run: python tests/penetration_testing.py

  usability-tests:
    runs-on: ubuntu-latest
    name: Usability Testing
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Run usability tests
      run: python tests/usability_tests_kid.py

  multilingual-tests:
    runs-on: ubuntu-latest
    name: Multilingual Testing
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Run multilingual tests
      run: python tests/multilingual_tests.py

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install linting tools
      run: |
        pip install flake8 pylint black
    
    - name: Lint with flake8
      run: flake8 core/ cli/ ui/ native_modules/ tests/ tools/ --count --show-source --statistics
    
    - name: Check code formatting
      run: black --check core/ cli/ ui/ native_modules/ tests/ tools/

  build:
    needs: [security-tests, usability-tests, multilingual-tests, code-quality]
    runs-on: ubuntu-latest
    name: Build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build application
      run: |
        echo "Creating source snapshot for CI..."
        mkdir -p dist/source
        cp -r core cli ui native_modules knowledge_base tests docs dist/source/
        cp README.md LICENSE.md requirements-windows.txt dist/source/
    
    - name: Create release artifact
      run: |
        tar -czf mentorai-${{ github.sha }}.tar.gz dist/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mentorai-build
        path: mentorai-${{ github.sha }}.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: mentorai-build
    
    - name: Deploy to production
      run: |
        echo "Deploying MentorAI v${{ github.sha }} to production..."
        # Deployment scripts would go here
        echo "Deployment completed successfully!"
