[pytest]
# Configuración única del runner de tests (pytest >= 7).
# `python_files = test_*.py` mantiene la convención histórica del repo; las
# suites interactivas (smoke_runtime, penetration_testing, security_tests,
# multilingual_tests, usability_tests_kid, ui_smoke, test_payment_flow) son
# scripts autónomos con su propio `__main__` y se ejecutan como pasos de CI,
# no bajo pytest, para no romper su salida legible.
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
